aid: confident-cannabis
name: Confident Cannabis
description: >-
  Confident Cannabis (CC Software LLC, operating as Confident LIMS) is a
  cloud-based Laboratory Information Management System for analytical testing
  labs and their clients across cannabis and hemp, food and beverage,
  environmental, agriculture, nutraceuticals, cosmetics, oil and gas, and
  industrial chemical testing. Its public v0 REST API lets labs manage samples,
  orders, and the order-status lifecycle, submit per-compound test results, and
  upload Certificates of Analysis, while testing clients read their labs,
  orders, samples, and results. Authentication is API-key based with optional
  HMAC-SHA256 request signing. Founded 2015 and backed by Bullpen Capital, the
  platform serves 100+ labs and 15,000+ active testing clients.
